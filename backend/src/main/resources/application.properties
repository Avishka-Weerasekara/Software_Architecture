spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT secret used to sign and verify tokens.
# Set JWT_SECRET in the environment for production deployments.
# Examples:
#   PowerShell: $bytes = New-Object byte[] 32; [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes); [Convert]::ToBase64String($bytes)
#   Bash: openssl rand -base64 32
# For local development, a fallback secret is provided below.
jwt.secret=${JWT_SECRET:dev_jwt_secret_change_me}
jwt.expiration=86400000

server.port=8080

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:test_webhook_secret}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment-success?sessionId={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/payment-cancelled}

# Twilio Configuration (SMS)
twilio.account.sid=${TWILIO_ACCOUNT_SID:TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your_auth_token}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+1234567890}