spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:dev_jwt_secret_change_me}
jwt.expiration=86400000

server.port=8081

stripe.api.key=${STRIPE_API_KEY:sk_test_change_me}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:test_webhook_secret}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment-success?sessionId={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/payment-cancelled}

twilio.account.sid=${TWILIO_ACCOUNT_SID:TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your_auth_token}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+1234567890}
